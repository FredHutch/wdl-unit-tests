        false\n}","inputs":"{\"conditional_example.quality_threshold\":90.0,\"conditional_example.samples\":[{\"name\":\"sample1\",\"quality_score\":95.5,\"type\":\"normal\"},{\"name\":\"sample2\",\"quality_score\":85.3,\"type\":\"tumor\"},{\"name\":\"sample3\",\"quality_score\":92.1,\"type\":\"normal\"}]}","workflowUrl":"","labels":"{}"},"calls":{},"outputs":{},"status":"Submitted","id":"e688c693-e3d9-4830-84a0-5f4e75d074d2","inputs":{},"labels":{"cromwell-workflow-id":"cromwell-e688c693-e3d9-4830-84a0-5f4e75d074d2"},"submission":"2026-10-25T03:24:21.198Z"}'
