        false\n}","inputs":"{\"conditional_example.quality_threshold\":90.0,\"conditional_example.samples\":[{\"name\":\"sample1\",\"quality_score\":95.5,\"type\":\"normal\"},{\"name\":\"sample2\",\"quality_score\":85.3,\"type\":\"tumor\"},{\"name\":\"sample3\",\"quality_score\":92.1,\"type\":\"normal\"}]}","workflowUrl":"","labels":"{}"},"calls":{},"outputs":{},"status":"Submitted","id":"a70686cf-827a-4b31-8a8d-d124f1fc6c8a","inputs":{},"labels":{"cromwell-workflow-id":"cromwell-a70686cf-827a-4b31-8a8d-d124f1fc6c8a"},"submission":"2026-10-01T21:00:39.983Z"}'
