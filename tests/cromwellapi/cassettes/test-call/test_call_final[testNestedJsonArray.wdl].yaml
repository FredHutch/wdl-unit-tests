        of sample 3: A detailed description of the third sample.\",\"sampleName\":\"Sample3\"}],\"testNestedJsonArray.cellNumber\":\"10000\"}","workflowUrl":"","labels":"{}"},"calls":{},"outputs":{},"status":"Submitted","id":"b8ab80df-5a2c-4147-86c0-6bcfabf7a147","inputs":{},"labels":{"cromwell-workflow-id":"cromwell-b8ab80df-5a2c-4147-86c0-6bcfabf7a147"},"submission":"2026-10-19T16:55:20.318Z"}'
