      ~{optional_remote_not_provided})\n    \n  >>>\n\n  output {\n    Array[File]
      out_files = glob(\"copied_jsons/*\")\n  }\n\n  runtime {\n    docker: \"ubuntu:20.04\"\n
      \ }\n}\n\r\n--b50e07208b542de295b9bf7da71d4c11\r\nContent-Disposition: form-data;
