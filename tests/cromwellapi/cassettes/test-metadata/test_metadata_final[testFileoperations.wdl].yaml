      The first file remains unchanged\n        File moved_file = \"output_dir/file2.txt\"
      \         # The second file after being moved\n        File renamed_file = \"file3_renamed.txt\"
      \          # The third file after being renamed\n    }\n\n    runtime {\n        docker:
